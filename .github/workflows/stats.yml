# Regenerates the README analytics cards inside this repo, daily, using the
# STATS_TOKEN secret so the cards can see private repositories (OdemLab etc.).
# The public instances (github-readme-stats.vercel.app, mirrors) only ever see
# public data: no Java, no private commits, 0 PRs - verified against the API.
# This is the deployment option recommended by anuraghazra/github-readme-stats:
#   https://github.com/marketplace/actions/github-readme-stats-action
# Until STATS_TOKEN is added, the cards fall back to the default GITHUB_TOKEN
# (public-only numbers) instead of failing; with a classic PAT (repo + read:user)
# they include private work. If the token expires, generation fails and the last
# good SVGs simply stay in place.
name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # daily, midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&count_private=true'
          path: .github/profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=dark&hide_border=true'
          path: .github/profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || github.token }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/profile/*.svg
          git commit -m "chore: refresh README analytics cards" || exit 0
          git push
